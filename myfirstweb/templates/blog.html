<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>my blog</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="blog">
        <a href = "http://127.0.0.1:5000/add/">add new post </a>
        <h1>MY BLOG</h1>
    {% for post in posts %}
        <div class="card">
          <h2><a href="{{url_for('post', post_id = post.id)}}">{{post.title}}</a></h2>
          <p>{{post.content}}</p>
        </div>
    {% endfor %}
</div>

</body>
</html>
